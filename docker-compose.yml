services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clareon_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_NAME=${EMAILS_FROM_NAME}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - MEDIA_DIR=/app/media
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clareon_worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAILS_FROM_NAME=${EMAILS_FROM_NAME}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
      - MEDIA_DIR=/app/media
    volumes:
      - media_data:/app/media
    command: celery -A app.core.celery_app worker --loglevel=info --pool=solo --concurrency=1

volumes:
  media_data: